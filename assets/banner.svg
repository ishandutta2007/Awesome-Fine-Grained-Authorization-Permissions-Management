<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="380">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <radialGradient id="glowCyan" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowPurple" cx="80%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>

    <!-- Text Gradients -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <linearGradient id="subGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Keyframe Animations -->
    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-10px) rotate(1deg); }
      }
      @keyframes floatFast {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-14px) rotate(-1.5deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.7; transform: scale(1.05); }
      }
      @keyframes nodePulse {
        0%, 100% { r: 6px; opacity: 0.8; }
        50% { r: 9px; opacity: 1; filter: drop-shadow(0 0 8px #38bdf8); }
      }
      @keyframes dashFlow {
        to { stroke-dashoffset: -40; }
      }
      @keyframes scanLine {
        0% { transform: translateY(-100%); }
        100% { transform: translateY(380px); }
      }

      .animated-bg-pulse { animation: pulseGlow 6s ease-in-out infinite; transform-origin: center; }
      .float-card-1 { animation: floatSlow 7s ease-in-out infinite; }
      .float-card-2 { animation: floatFast 5.5s ease-in-out infinite; }
      .float-card-3 { animation: floatSlow 8s ease-in-out infinite 1s; }
      .node-anim { animation: nodePulse 3s ease-in-out infinite; }
      .line-flow { stroke-dasharray: 8, 8; animation: dashFlow 2s linear infinite; }
    </style>
  </defs>

  <!-- Base Canvas & Background Layer -->
  <rect width="1200" height="380" fill="url(#bgGrad)" rx="16"/>
  <rect width="1200" height="380" fill="url(#glowCyan)" rx="16" class="animated-bg-pulse"/>
  <rect width="1200" height="380" fill="url(#glowPurple)" rx="16" class="animated-bg-pulse" style="animation-delay: 3s;"/>

  <!-- Background Cybernetic Grid & Graph Nodes (Zanzibar / ReBAC visual motif) -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.4">
    <line x1="0" y1="76" x2="1200" y2="76"/>
    <line x1="0" y1="152" x2="1200" y2="152"/>
    <line x1="0" y1="228" x2="1200" y2="228"/>
    <line x1="0" y1="304" x2="1200" y2="304"/>

    <line x1="200" y1="0" x2="200" y2="380"/>
    <line x1="400" y1="0" x2="400" y2="380"/>
    <line x1="600" y1="0" x2="600" y2="380"/>
    <line x1="800" y1="0" x2="800" y2="380"/>
    <line x1="1000" y1="0" x2="1000" y2="380"/>
  </g>

  <!-- Animated Graph Tuple Relationships (Background Layer) -->
  <g stroke="#38bdf8" stroke-width="1.5" opacity="0.3" class="line-flow">
    <line x1="900" y1="90" x2="1040" y2="150"/>
    <line x1="1040" y1="150" x2="980" y2="270"/>
    <line x1="980" y1="270" x2="1110" y2="300"/>
    <line x1="900" y1="90" x2="1110" y2="300"/>
  </g>

  <g opacity="0.6">
    <circle cx="900" cy="90" r="6" fill="#38bdf8" class="node-anim"/>
    <circle cx="1040" cy="150" r="6" fill="#818cf8" class="node-anim" style="animation-delay: 1s;"/>
    <circle cx="980" cy="270" r="6" fill="#34d399" class="node-anim" style="animation-delay: 2s;"/>
    <circle cx="1110" cy="300" r="6" fill="#a78bfa" class="node-anim" style="animation-delay: 0.5s;"/>
  </g>

  <!-- Floating Feature Badges / Cards (Background/Midground Layer) -->
  <!-- Card 1: ReBAC -->
  <g class="float-card-1" opacity="0.75" transform="translate(850, 45)">
    <rect width="130" height="38" rx="19" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="65" y="24" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" text-anchor="middle">⚡ ReBAC Graph</text>
  </g>

  <!-- Card 2: ABAC / OPA -->
  <g class="float-card-2" opacity="0.75" transform="translate(1010, 115)">
    <rect width="140" height="38" rx="19" fill="#0f172a" stroke="#a78bfa" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="70" y="24" fill="#a78bfa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" text-anchor="middle">📜 Policy-as-Code</text>
  </g>

  <!-- Card 3: Zanzibar -->
  <g class="float-card-3" opacity="0.75" transform="translate(920, 290)">
    <rect width="150" height="38" rx="19" fill="#0f172a" stroke="#34d399" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="75" y="24" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" text-anchor="middle">🌐 Google Zanzibar</text>
  </g>

  <!-- Security Shield Emblem (Midground Left) -->
  <g transform="translate(70, 75)" filter="url(#shadow)">
    <!-- Outer Shield Glow -->
    <path d="M70 10 L130 35 V90 C130 145 70 180 70 180 C70 180 10 145 10 90 V35 Z" fill="url(#shieldGrad)" opacity="0.9"/>
    <path d="M70 22 L120 43 V87 C120 133 70 162 70 162 C70 162 20 133 20 87 V43 Z" fill="#0f172a"/>
    <!-- Lock Core -->
    <rect x="52" y="90" width="36" height="38" rx="6" fill="#38bdf8"/>
    <path d="M57 90 V76 C57 68 63 62 70 62 C77 62 83 68 83 76 V90" fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round"/>
    <circle cx="70" cy="104" r="4" fill="#0f172a"/>
    <path d="M70 108 V118" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- FOREGROUND LAYER: Title & Subtitle (Always crisp, layered on top) -->
  <g transform="translate(230, 0)">
    <!-- Main Title -->
    <text x="0" y="145" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="38" font-weight="800" letter-spacing="-0.5" filter="url(#shadow)">
      Awesome Fine-Grained Authorization
    </text>
    <text x="0" y="195" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5" filter="url(#shadow)">
      &amp; Permissions Management 🔐 🛡️
    </text>

    <!-- Subtitle Description -->
    <text x="0" y="242" fill="url(#subGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" letter-spacing="0.2">
      ReBAC • ABAC • Google Zanzibar • Policy-as-Code (OPA/Cedar) • PDP / PEP Architecture
    </text>

    <!-- Status Tags / Highlights -->
    <g transform="translate(0, 272)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="145" height="30" rx="6" fill="#1e293b" stroke="#334155"/>
      <text x="72" y="19" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" text-anchor="middle">2026 Ecosystem</text>

      <!-- Pill 2 -->
      <rect x="155" y="0" width="165" height="30" rx="6" fill="#1e293b" stroke="#334155"/>
      <text x="237" y="19" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" text-anchor="middle">SaaS &amp; Open-Source</text>

      <!-- Pill 3 -->
      <rect x="330" y="0" width="150" height="30" rx="6" fill="#1e293b" stroke="#334155"/>
      <text x="405" y="19" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Curated Directory</text>
    </g>
  </g>
</svg>
